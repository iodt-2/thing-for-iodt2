[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
asyncio_default_fixture_loop_scope = function

# rdflib 7 still calls deprecated pyparsing APIs and its own ConjunctiveGraph.
# Nothing we can act on, and the noise buries real warnings.
filterwarnings =
    ignore::DeprecationWarning:rdflib.*
    ignore::DeprecationWarning:pyparsing.*
    ignore:.*pyparsing.*:DeprecationWarning
    ignore::UserWarning:pyparsing.*
    ignore:.*deprecated.*:UserWarning:rdflib.*
